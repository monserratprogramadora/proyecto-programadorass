<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librería Escolar</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="estilo-libreria.css">
</head>
<body data-semestre="6">
<nav class="navbar">
<div class="container">
<a class="navbar-brand" href="#">Librería Escolar del CBTIS 272</a>
<div class="d-flex gap-2">
<button class="btn btn-light" data-bs-toggle="offcanvas" data-bs-target="#carrito">
🛒 Carrito <span id="cantidadCarrito" class="badge bg-danger">0</span>
</button>
<button class="btn btn-outline-light" onclick="cerrarSesion()">Cerrar sesión</button>
</div>
</div>
</nav>
<div class="container">
<div class="principal text-center">
<h1 id ="bienvenida">¡Bienvenid@s a nuestra librería Aguilas!</h1>
<p class="text-secondary">Libros correspondientes al sexto semestre.</p>
<div class="buscador mt-4">
<input type="text" id="buscarLibro" class="form-control form-control-lg" placeholder="🔍 Buscar..." onkeyup="buscarLibros()">
</div>
</div>
<h3 class="titulo-seccion mt-5 mb-4">Nuestro catálogo</h3>
<div class="row g-4" id="catalogo"></div>
<p id="sinResultados" class="text-center text-secondary mt-4" style="display:none">No se encontraron libros con ese nombre.</p>
</div>
<div class="offcanvas offcanvas-end" tabindex="-1" id="carrito">
<div class="offcanvas-header">
<h5>🛒 Mi carrito de compras</h5>
<button class="btn-close" data-bs-dismiss="offcanvas"></button>
</div>
<div class="offcanvas-body">
<div id="productosCarrito"></div>
<hr>
<h5 class="text-end">Total: $<span id="total">0.00</span></h5>
<button class="btn btn-success w-100 mt-3" onclick="finalizarCompra()">Finalizar compra</button>
</div>
</div>
<footer>
<p class="mb-0">Librería Escolar del CBTIS 272 | Todos los derechos reservados</p>
</footer>
<script src="libreria.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
